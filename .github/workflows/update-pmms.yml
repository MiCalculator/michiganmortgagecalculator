name: Update PMMS rates

on:
  workflow_dispatch:
  schedule:
    # Every Thursday at 11:05 UTC (~6:05am ET during standard time)
    - cron: "5 11 * * 4"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update pmms.json
        env:
          PMMS_SOURCE: "https://michiganmortgagecalculator.org/api/pmms"
        run: |
          python .github/scripts/update_pmms.py
          echo "==== pmms.json ===="
          cat pmms.json

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pmms.json
          git commit -m "Update PMMS rates"
          git push
