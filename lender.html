<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connect With a Lender – Michigan Mortgage Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="canonical" href="https://michiganmortgagecalculator.org/lender.html" />

  <meta name="description" content="Get connected with a preferred lender in Michigan. Share a few details and we’ll follow up." />

  <link rel="icon" href="/michigan-mortgage-calculator-thumbnail.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="/michigan-mortgage-calculator-thumbnail.png" />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6HLMW6NEJ4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6HLMW6NEJ4');
  </script>

  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text","Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f5f7; color: #111827; }
    a { color: inherit; }

    .page { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }

    header { text-align: center; margin-bottom: 12px; }
    header a.brand {
      display: inline-block;
      font-size: 1.8rem;
      font-weight: 800;
      text-decoration: none;
      color: #111827;
    }
    header a.brand:hover { text-decoration: underline; }
    header p { margin: 6px 0 0; color: #4b5563; }

    .navbar {
      background: #f5f0e6;
      border: 1px solid #eadfcd;
      border-radius: 14px;
      padding: 10px 12px;
      text-align: center;
      font-size: 0.95rem;
      margin: 12px auto 18px;
    }
    .navbar a { text-decoration: none; font-weight: 700; }
    .navbar a:hover { text-decoration: underline; }
    .navbar .sep { margin: 0 10px; color: #9ca3af; }

    /* Centered layout */
    .center-wrap {
      display: grid;
      place-items: center;
      min-height: calc(100vh - 220px);
    }
    .card {
      width: min(680px, 100%);
      background: #fff;
      border-radius: 18px;
      padding: 18px 16px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    }

    .section-label { font-size: 0.78rem; text-transform: uppercase; color: #9ca3af; margin-bottom: 4px; }
    h1 { margin: 0 0 6px; font-size: 1.7rem; }
    .subhead { margin: 0 0 14px; color: #4b5563; line-height: 1.4; }

    .field-group { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    @media (max-width: 640px) { .field-group { grid-template-columns: 1fr; } }

    label { font-size: 0.8rem; margin-bottom: 4px; color: #4b5563; display: block; }
    input, textarea {
      width: 100%;
      padding: 10px 10px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      background: #fff;
      font-size: 0.95rem;
    }
    input:focus, textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 1px rgba(37,99,235,0.25);
      outline: none;
    }

    .btn {
      margin-top: 14px;
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #374151;
      display: none;
      font-size: 0.92rem;
      line-height: 1.35;
    }
    .status.ok { border-color: #bbf7d0; background: #f0fdf4; }
    .status.err { border-color: #fecaca; background: #fef2f2; }

    .footer {
      margin-top: 18px;
      text-align: center;
      color: #6b7280;
      font-size: 0.85rem;
    }
    .footer a { color: #2563eb; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <a class="brand" href="/">Michigan Mortgage Calculator</a>
    </header>

    <nav class="navbar">
      <a href="/">Calculator</a><span class="sep">|</span>
      <a href="/lender.html">Lender</a><span class="sep">|</span>
      <a href="/realtor.html">Realtor</a><span class="sep">|</span>
      <a href="/contact.html">Contact</a>
    </nav>

    <div class="center-wrap">
      <div class="card">
        <div class="section-label">Get Started</div>
        <h1>Connect With a Lender</h1>
        <p class="subhead">
          Share a few details and we’ll follow up to connect you with a lender that fits your situation.
          <strong>Prefer to call/text?</strong> <a href="tel:16162059531">616-205-9531</a>
        </p>

        <form id="leadForm">
          <div class="field-group">
            <div>
              <label for="name">Name</label>
              <input id="name" name="name" autocomplete="name" required />
            </div>
            <div>
              <label for="phone">Phone</label>
              <input id="phone" name="phone" autocomplete="tel" required />
            </div>
          </div>

          <div class="field-group" style="margin-top:10px;">
            <div>
              <label for="email">Email (optional)</label>
              <input id="email" name="email" type="email" autocomplete="email" />
            </div>
            <div>
              <label for="notes">Notes (optional)</label>
              <input id="notes" name="notes" placeholder="Ex: purchase, refi, timeline…" />
            </div>
          </div>

          <!-- honeypot -->
          <input type="text" id="website" name="website" style="display:none" tabindex="-1" autocomplete="off"/>

          <button class="btn" id="submitBtn" type="submit">Submit</button>

          <div id="statusOk" class="status ok"></div>
          <div id="statusErr" class="status err"></div>
        </form>

        <div class="footer">
          Contact: <a href="mailto:michiganmortgagecalculator@gmail.com">michiganmortgagecalculator@gmail.com</a> ·
          <a href="/privacy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("leadForm");
    const btn = document.getElementById("submitBtn");
    const okBox = document.getElementById("statusOk");
    const errBox = document.getElementById("statusErr");

    function show(el, msg) { el.textContent = msg; el.style.display = "block"; }
    function hide(el) { el.style.display = "none"; el.textContent = ""; }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hide(okBox); hide(errBox);

      // simple bot trap
      if (document.getElementById("website").value) return;

      btn.disabled = true;
      btn.textContent = "Submitting…";

      const payload = {
        type: "lender",
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        notes: document.getElementById("notes").value.trim(),
      };

      try {
        const res = await fetch("/api/lead", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const text = await res.text();
        let data = null;
        try { data = JSON.parse(text); } catch { data = { ok: res.ok, raw: text }; }

        if (!res.ok || !data.ok) {
          show(errBox, "Error submitting. Prefer to call/text? 616-205-9531.");
        } else {
          show(okBox, "Submitted! We’ll follow up shortly. Prefer to call/text? 616-205-9531.");
          form.reset();
        }
      } catch (err) {
        show(errBox, "Error submitting. Prefer to call/text? 616-205-9531.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Submit";
      }
    });
  </script>
</body>
</html>
