<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PMMS Admin – Michigan Mortgage Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/michigan-mortgage-calculator-thumbnail.png" />
  <style>
    *{box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{margin:0;background:#f5f5f7;color:#111827}
    .page{max-width:820px;margin:0 auto;padding:24px 16px 48px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.08)}
    h1{margin:0 0 6px}
    p{margin:0 0 12px;color:#4b5563}
    label{display:block;font-size:.85rem;color:#374151;margin-top:12px}
    input{width:100%;padding:10px;border-radius:12px;border:1px solid #d1d5db;margin-top:6px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:700px){.row{grid-template-columns:1fr}}
    button{margin-top:14px;padding:10px 14px;border-radius:12px;border:none;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-weight:700;cursor:pointer}
    .status{margin-top:12px;font-size:.9rem}
    .status.ok{color:#065f46}
    .status.bad{color:#b91c1c}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:.85rem;color:#374151;white-space:pre-wrap;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin-top:10px}
    a{color:#2563eb;text-decoration:none}
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>PMMS Admin</h1>
      <p>Update the displayed default rates. This writes to Cloudflare KV via your Worker.</p>

      <div class="row">
        <div>
          <label>30-year rate</label>
          <input id="r30" type="number" step="0.01" placeholder="6.23" />
        </div>
        <div>
          <label>15-year rate</label>
          <input id="r15" type="number" step="0.01" placeholder="5.51" />
        </div>
      </div>

      <label>Admin key</label>
      <input id="adminkey" type="password" placeholder="Paste your ADMIN_KEY" />

      <button id="loadBtn" type="button">Load Current</button>
      <button id="saveBtn" type="button">Save Update</button>

      <div id="status" class="status"></div>
      <div id="dump" class="mono" style="display:none;"></div>

      <p style="margin-top:14px">
        Back to <a href="/">Calculator</a>
      </p>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const dumpEl = document.getElementById("dump");
    const r30 = document.getElementById("r30");
    const r15 = document.getElementById("r15");
    const key = document.getElementById("adminkey");

    function setStatus(msg, ok=true) {
      statusEl.textContent = msg;
      statusEl.className = "status " + (ok ? "ok" : "bad");
    }

    async function loadCurrent() {
      setStatus("Loading…");
      dumpEl.style.display = "none";
      const res = await fetch("/api/pmms", { cache: "no-store" });
      const data = await res.json();
      r30.value = data.pmms30yr ?? data["30-year"] ?? "";
      r15.value = data.pmms15yr ?? data["15-year"] ?? "";
      dumpEl.style.display = "block";
      dumpEl.textContent = JSON.stringify(data, null, 2);
      setStatus("Loaded current PMMS values.");
    }

    async function saveUpdate() {
      const adminKey = key.value.trim();
      if (!adminKey) return setStatus("Missing admin key.", false);

      const body = {
        pmms30yr: Number(r30.value),
        pmms15yr: Number(r15.value)
      };

      setStatus("Saving…");
      dumpEl.style.display = "none";

      const res = await fetch("/api/pmms/update", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Admin-Key": adminKey
        },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      if (!res.ok || !data.ok) {
        dumpEl.style.display = "block";
        dumpEl.textContent = JSON.stringify(data, null, 2);
        return setStatus("Save failed. See details below.", false);
      }

      dumpEl.style.display = "block";
      dumpEl.textContent = JSON.stringify(data.pmms, null, 2);
      setStatus("Saved. Your site should reflect this immediately.");
    }

    document.getElementById("loadBtn").addEventListener("click", loadCurrent);
    document.getElementById("saveBtn").addEventListener("click", saveUpdate);

    // auto-load
    loadCurrent().catch(() => setStatus("Load failed.", false));
  </script>
</body>
</html>
